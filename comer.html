<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dónde Comer | Gastronomía en Bariloche | Bariloche.Online</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=2213">
</head>

<body class="page-accommodations native-app">
    <header class="main-header">
        <a href="index.html" class="logo" style="text-decoration:none; color:inherit;"><b>B</b> BARILOCHE.ONLINE</a>
        <nav class="nav-desktop">
            <a href="mapa.html" class="nav-link"><i class="fas fa-satellite-dish"></i> EN VIVO</a>
            <a href="servicios.html" class="nav-link">SERVICIOS</a>
            <a href="comer.html" class="nav-link active">COMER</a>
            <a href="alojamiento.html" class="nav-link">DORMIR</a>
            <a href="radios.html" class="nav-link">MEDIOS</a>
            <a href="vuelos.html" class="nav-link">VUELOS</a>
            <a href="precios.html" class="nav-link" style="color:#0084ff; font-weight:800;"><i class="fas fa-tag"></i> PRECIOS</a>
        </nav>
        <div class="header-icons">
            <div id="userAuthStatus"></div>
            <div class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
        </div>
    </header>

    <main class="accommodation-layout">
        <!-- Lista lateral de gastronomía -->
        <div class="accommodation-sidebar">
            <div class="browse-header">
                <div>
                    <h1>Dónde Comer</h1>
                    <p id="gastronomy-count">Cargando restaurantes...</p>
                </div>
                <button onclick="handlePublishGastoClick()" class="btn-publish-header" style="background:#e67e22; border-color:#e67e22;">
                    <i class="fas fa-plus-circle"></i> Publicar Mi Local
                </button>
            </div>

            <div id="gastoCategoryFilters"
                style="padding: 0 5%; margin-bottom: 20px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;">
                <span class="gasto-filter-chip active" onclick="filterGastronomyByType('all', this)"
                    style="background: var(--primary); color: white; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor:pointer;">Todos</span>
                <span class="gasto-filter-chip" onclick="filterGastronomyByType('Cervecería', this)"
                    style="background: var(--bg-secondary); border: 1px solid var(--border); color:var(--text-primary); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor:pointer;">🍺 Cervecerías</span>
                <span class="gasto-filter-chip" onclick="filterGastronomyByType('Parrilla', this)"
                    style="background: var(--bg-secondary); border: 1px solid var(--border); color:var(--text-primary); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor:pointer;">🥩 Parrillas</span>
                <span class="gasto-filter-chip" onclick="filterGastronomyByType('Chocolatería', this)"
                    style="background: var(--bg-secondary); border: 1px solid var(--border); color:var(--text-primary); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor:pointer;">🍫 Chocolaterías</span>
                <span class="gasto-filter-chip" onclick="filterGastronomyByType('Bodegón', this)"
                    style="background: var(--bg-secondary); border: 1px solid var(--border); color:var(--text-primary); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor:pointer;">🥘 Bodegones</span>
            </div>

            <div id="gastronomyList" class="accommodations-list"></div>
        </div>

        <!-- Mapa -->
        <div class="accommodation-map-container">
            <div id="map"></div>
        </div>
    </main>

    <!-- Modal para ver detalles -->
    <div id="gastronomyModal" class="modal-overlay" onclick="closeGastronomyModal()">
        <div class="modal-content accommodation-modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeGastronomyModal()"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- App Bottom Nav -->
    <nav class="mobile-nav">
        <a href="mapa.html" class="mobile-nav-item">
            <i class="fas fa-satellite-dish"></i>
            <span>En Vivo</span>
        </a>
        <a href="servicios.html" class="mobile-nav-item">
            <i class="fas fa-briefcase"></i>
            <span>Servicios</span>
        </a>
        <a href="comer.html" class="mobile-nav-item active">
            <i class="fas fa-utensils"></i>
            <span>Comer</span>
        </a>
        <a href="alojamiento.html" class="mobile-nav-item">
            <i class="fas fa-bed"></i>
            <span>Dormir</span>
        </a>
        <a href="vuelos.html" class="mobile-nav-item">
            <i class="fas fa-plane"></i>
            <span>Vuelos</span>
        </a>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_manager.js?v=99999"></script>
    <script src="app.js?v=99999"></script>
    <script src="gastronomy.js?v=99999"></script>
</body>

</html>
