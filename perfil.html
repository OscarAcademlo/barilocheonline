<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Perfil | Bariloche.Online</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=2060">
</head>

<body class="page-profile native-app">
    <header class="main-header">
        <a href="index.html" class="logo" style="text-decoration:none; color:inherit;"><b>B</b> BARILOCHE.ONLINE</a>
        <nav class="nav-desktop">
            <a href="mapa.html" class="nav-link"><i class="fas fa-satellite-dish"></i> EN VIVO</a>
            <a href="radios.html" class="nav-link">RADIOS</a>
            <a href="vuelos.html" class="nav-link">VUELOS</a>
            <a href="alojamiento.html" class="nav-link">DORMIR</a>
            <a href="comer.html" class="nav-link">COMER</a>
        </nav>
        <div class="header-icons">
            <div class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
        </div>
    </header>

    <main class="app-content">
        <div class="browse-header">
            <h1>Tu Perfil Turista</h1>
            <p>Gestioná tus reservas en BariRuta, radios favoritas y preferencias.</p>
        </div>

        <div class="profile-card"
            style="background:var(--bg-secondary); padding:30px; border-radius:30px; border:1px solid var(--border); text-align:center; box-shadow:var(--shadow); max-width:500px; margin:0 auto;">
            <div
                style="width:100px; height:100px; border-radius:50%; background:var(--primary-light); color:var(--primary); font-size:3rem; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
                <i class="fas fa-user-circle"></i>
            </div>
            <h2 style="font-family:'Outfit';">Turista en Bariloche</h2>
            <p style="color:var(--text-secondary); margin-bottom:25px;">Iniciá sesión con Google para sincronizar tus pasajes y solicitar paradas.</p>
            
            <button
                onclick="alert('¡Sesión de turista iniciada con Google!')"
                style="width:100%; padding:15px; border-radius:15px; border:none; background:var(--text-primary); color:var(--bg-secondary); font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" style="width:20px; height:20px;">
                <span>CONTINUAR CON GOOGLE</span>
            </button>
        </div>
    </main>

    <!-- App Bottom Nav -->
    <nav class="mobile-nav">
        <a href="mapa.html" class="mobile-nav-item">
            <i class="fas fa-satellite-dish"></i>
            <span>En Vivo</span>
        </a>
        <a href="radios.html" class="mobile-nav-item">
            <i class="fas fa-radio"></i>
            <span>Radios</span>
        </a>
        <a href="vuelos.html" class="mobile-nav-item">
            <i class="fas fa-plane"></i>
            <span>Vuelos</span>
        </a>
        <a href="alojamiento.html" class="mobile-nav-item">
            <i class="fas fa-bed"></i>
            <span>Dormir</span>
        </a>
        <a href="comer.html" class="mobile-nav-item">
            <i class="fas fa-utensils"></i>
            <span>Comer</span>
        </a>
    </nav>

    <script src="app.js?v=2060"></script>
</body>

</html>
